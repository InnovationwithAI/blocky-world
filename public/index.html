<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blocky World - Multiplayer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7ec0ee; font-family: sans-serif; user-select: none; }
  canvas { display: block; }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border: 2px solid white; border-radius: 50%;
    pointer-events: none; mix-blend-mode: difference;
  }
  #instructions {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); color: white; text-align: center; cursor: pointer; z-index: 20;
  }
  #instructions div { max-width: 500px; }
  #hint {
    position: fixed; bottom: 84px; left: 10px; color: white; font-size: 13px;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px; pointer-events: none;
  }
  #stats {
    position: fixed; top: 10px; left: 10px; color: white; font-size: 13px; width: 200px;
    background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 6px; pointer-events: none;
  }
  .bar-label { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .bar-track { width: 100%; height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width 0.15s linear; }
  #health-fill { background: #e05555; }
  #hunger-fill { background: #d99a3f; }
  #hotbar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: none;
  }
  .slot {
    width: 58px; height: 58px; border-radius: 6px; background: rgba(0,0,0,0.45);
    border: 2px solid rgba(255,255,255,0.25); display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; color: white; font-size: 11px; position: relative;
  }
  .slot.active { border-color: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.7); }
  .swatch { width: 26px; height: 26px; border-radius: 4px; margin-top: 6px; }
  .key { position: absolute; top: 2px; left: 5px; font-size: 10px; opacity: 0.8; }
  .count { margin-bottom: 3px; font-weight: bold; }
  #players-online {
    position: fixed; top: 10px; right: 10px; color: white; font-size: 13px;
    background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 6px; pointer-events: none;
  }
  #dead-banner {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ff5555; font-size: 42px; font-weight: bold; background: rgba(0,0,0,0.4); z-index: 15; pointer-events: none;
  }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hint">WASD move &middot; Mouse look &middot; Space jump &middot; Left-click break/attack &middot; Right-click place &middot; 1-6 select block &middot; C craft planks</div>
<div id="stats">
  <div class="bar-label"><span>Health</span></div>
  <div class="bar-track"><div class="bar-fill" id="health-fill" style="width:100%"></div></div>
  <div class="bar-label"><span>Hunger</span></div>
  <div class="bar-track"><div class="bar-fill" id="hunger-fill" style="width:100%"></div></div>
</div>
<div id="players-online">Players online: 1</div>
<div id="dead-banner">You died — respawning...</div>
<div id="hotbar"></div>
<div id="instructions">
  <div>
    <h1>Blocky World</h1>
    <p>Click to play. Build with a friend, survive the night. Press ESC to release the mouse.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/PointerLockControls.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared/world.js"></script>
<script src="/client.js"></script>
</body>
</html>
